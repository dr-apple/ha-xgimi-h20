# XGIMI H20 – projector dashboard (Liquid Glass style)
# Paste: dashboard → ⋮ → Edit → ⋮ → Raw configuration editor → under "views:"
# Requires (HACS, frontend): button-card, firemote-card
# Optional: theme "Liquid Glass" from https://github.com/Nezz/homeassistant-visionos-theme  →  add "theme: Liquid Glass" to the view
# Entity IDs are for an English Home Assistant with the device name "XGIMI H20".
# Adjust: media_player.xgimi_h20_google_tv / remote.xgimi_h20_google_tv (Android TV Remote integration, power + remote)
#         media_player.xgimi_h20_adb (Android TV integration via ADB, for firemote-card)
- title: Projector
  path: beamer
  type: sections
  max_columns: 4
  icon: mdi:projector
  badges:
  - type: entity
    entity: update.xgimi_h20
    show_name: true
    name: Update
    visibility:
    - condition: state
      entity: update.xgimi_h20
      state: 'on'
  sections:
  - type: grid
    column_span: 2
    cards:
    - type: custom:button-card
      entity: sensor.xgimi_h20_power_state
      show_name: false
      show_icon: false
      show_state: false
      tap_action:
        action: more-info
        entity: sensor.xgimi_h20_foreground_app
      triggers_update:
      - sensor.xgimi_h20_foreground_app
      - sensor.xgimi_h20_hdr_format
      - sensor.xgimi_h20_input_source
      - select.xgimi_h20_picture_mode
      custom_fields:
        art: |-
          [[[
                    const on = ['on','screensaver'].includes(entity.state);
                    const a = (states['sensor.xgimi_h20_foreground_app']||{}).state || '';
                    let icon = 'mdi:projector';
                    if (on) icon = a.startsWith('HDMI') ? 'mdi:video-input-hdmi' : 'mdi:play';
                    return `<ha-icon icon="${icon}"></ha-icon>`;
                  ]]]
        eyebrow: '[[[ return entity.state === ''screensaver'' ? ''Paused'' : ([''on''].includes(entity.state) ? ''Now playing'' : ''XGIMI H20''); ]]]'
        title: |-
          [[[
                    if (!['on','screensaver'].includes(entity.state)) return 'Projector off';
                    const a = states['sensor.xgimi_h20_foreground_app'];
                    return a && !['unknown','unavailable'].includes(a.state) ? a.state : 'XGIMI H20';
                  ]]]
        meta: |-
          [[[
                    if (!['on','screensaver'].includes(entity.state)) return '<span class="sub">Standby</span>';
                    const M = {
            standard:['Standard','mdi:image-outline'], movie:['Movie','mdi:filmstrip'],
            vivid:['Vivid','mdi:palette'], imaxenhanced:['IMAX Enhanced','mdi:theater'],
            game:['Game','mdi:gamepad-variant'], sport:['Sport','mdi:soccer-field'],
            filmmaker:['Filmmaker','mdi:movie-open-star'], user:['ISF Day','mdi:white-balance-sunny'],
            energy_saving:['ISF Night','mdi:weather-night'],
            dolbyvisionbright:['Bright','mdi:dolby'], dolbyvisiondark:['Dark','mdi:dolby'],
            dolbyvisionvivid:['Vivid','mdi:dolby'], dolbyvisioniq:['IQ','mdi:dolby'],
            dolbyvisiongame:['Game','mdi:dolby'], dolbyvisionfilmmaker:['Filmmaker','mdi:dolby'],
            dolbyvisioniqfilmmaker:['IQ Filmmaker','mdi:dolby']};
                    const s = id => (states[id] && !['unknown','unavailable'].includes(states[id].state)) ? states[id].state : null;
                    const hdr = s('sensor.xgimi_h20_hdr_format'), src = s('sensor.xgimi_h20_input_source'), m = s('select.xgimi_h20_picture_mode'), a = s('sensor.xgimi_h20_foreground_app');
                    const out = [];
                    if (hdr) out.push('<span class="badge' + (hdr === 'SDR' ? ' quiet' : '') + '">' + hdr + '</span>');
                    const line = [];
                    if (m) line.push('Picture mode ' + (M[m] ? M[m][0] : m));
                    if (src && src !== a) line.push(src);
                    if (line.length) out.push('<span class="sub">' + line.join(' · ') + '</span>');
                    return out.join('');
                  ]]]
      styles:
        grid:
        - grid-template-areas: '"art eyebrow" "art title" "art meta"'
        - grid-template-columns: auto 1fr
        - grid-template-rows: auto auto auto
        - column-gap: 18px
        - align-items: center
        card:
        - padding: 20px
        - border-radius: 28px
        - font-family: '''SF Pro'', -apple-system, BlinkMacSystemFont, ''Helvetica Neue'', sans-serif'
        - border: 0.5px solid rgba(255,255,255,.28)
        - box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 8px 24px rgba(0,0,0,.25)
        custom_fields:
          art:
          - width: 88px
          - height: 88px
          - border-radius: 20px
          - display: flex
          - align-items: center
          - justify-content: center
          - background: '[[[ return [''on'',''screensaver''].includes(states[''sensor.xgimi_h20_power_state''].state) ? ''linear-gradient(145deg,#5e5ce6 0%,#0a84ff 55%,#64d2ff 100%)'' : ''linear-gradient(145deg,#48484a,#2c2c2e)''; ]]]'
          - box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 10px 24px rgba(0,0,0,.35)
          - color: white
          - --mdc-icon-size: 44px
          eyebrow:
          - justify-self: start
          - font-size: 13px
          - font-weight: '600'
          - letter-spacing: .2px
          - color: var(--secondary-text-color)
          title:
          - justify-self: start
          - text-align: left
          - font-size: 28px
          - font-weight: '700'
          - letter-spacing: -.4px
          - line-height: '1.15'
          - color: var(--primary-text-color)
          - white-space: normal
          meta:
          - justify-self: start
          - display: flex
          - flex-wrap: wrap
          - align-items: center
          - gap: 8px
          - margin-top: 4px
      extra_styles: "\n      .badge { font-size: 11px; font-weight: 700; letter-spacing: .3px; padding: 3px 8px; border-radius: 6px;\n               color: #000; background: rgba(255,255,255,.92); }\n      .badge.quiet { color: var(--primary-text-color); background: transparent; border: 1px solid rgba(255,255,255,.5); }\n      .sub { font-size: 14px; color: var(--secondary-text-color); }\n    "
      grid_options:
        columns: full
