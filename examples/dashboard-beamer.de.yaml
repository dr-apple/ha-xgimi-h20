# XGIMI H20 – Beamer-Dashboard (Liquid-Glass-Stil)
# Einfügen: Dashboard → ⋮ → Bearbeiten → ⋮ → Raw-Konfigurationseditor → unter "views:" einfügen
# Benötigt (HACS, Frontend): button-card, firemote-card
# Optional: Theme "Liquid Glass" aus https://github.com/Nezz/homeassistant-visionos-theme  →  "theme: Liquid Glass" in der View ergänzen
# Entity-IDs gelten für ein deutschsprachiges Home Assistant mit dem Gerätenamen "XGIMI H20".
# Anpassen: media_player.xgimi_h20_google_tv / remote.xgimi_h20_google_tv (Android-TV-Remote-Integration, Ein/Aus + Fernbedienung)
#           media_player.xgimi_h20_adb (Android-TV-Integration per ADB, für firemote-card)
- title: Beamer
  path: beamer
  type: sections
  max_columns: 4
  icon: mdi:projector
  badges:
  - type: entity
    entity: update.xgimi_h20
    show_name: true
    name: Update
    visibility:
    - condition: state
      entity: update.xgimi_h20
      state: 'on'
  sections:
  - type: grid
    column_span: 2
    cards:
    - type: custom:button-card
      entity: sensor.xgimi_h20_betriebszustand
      show_name: false
      show_icon: false
      show_state: false
      tap_action:
        action: more-info
        entity: sensor.xgimi_h20_aktive_app
      triggers_update:
      - sensor.xgimi_h20_aktive_app
      - sensor.xgimi_h20_hdr_format
      - sensor.xgimi_h20_eingangsquelle
      - select.xgimi_h20_bildmodus
      custom_fields:
        art: |-
          [[[
                    const on = ['on','screensaver'].includes(entity.state);
                    const a = (states['sensor.xgimi_h20_aktive_app']||{}).state || '';
                    let icon = 'mdi:projector';
                    if (on) icon = a.startsWith('HDMI') ? 'mdi:video-input-hdmi' : 'mdi:play';
                    return `<ha-icon icon="${icon}"></ha-icon>`;
                  ]]]
        eyebrow: '[[[ return entity.state === ''screensaver'' ? ''Pausiert'' : ([''on''].includes(entity.state) ? ''Jetzt läuft'' : ''XGIMI H20''); ]]]'
        title: |-
          [[[
                    if (!['on','screensaver'].includes(entity.state)) return 'Beamer aus';
                    const a = states['sensor.xgimi_h20_aktive_app'];
                    return a && !['unknown','unavailable'].includes(a.state) ? a.state : 'XGIMI H20';
                  ]]]
        meta: |-
          [[[
                    if (!['on','screensaver'].includes(entity.state)) return '<span class="sub">Standby</span>';
                    const M = {
            standard:['Standard','mdi:image-outline'], movie:['Film','mdi:filmstrip'],
            vivid:['Lebhaft','mdi:palette'], imaxenhanced:['IMAX Enhanced','mdi:theater'],
            game:['Spiel','mdi:gamepad-variant'], sport:['Sport','mdi:soccer-field'],
            filmmaker:['Filmmaker','mdi:movie-open-star'], user:['ISF Tag','mdi:white-balance-sunny'],
            energy_saving:['ISF Nacht','mdi:weather-night'],
            dolbyvisionbright:['Hell','mdi:dolby'], dolbyvisiondark:['Dunkel','mdi:dolby'],
            dolbyvisionvivid:['Lebhaft','mdi:dolby'], dolbyvisioniq:['IQ','mdi:dolby'],
            dolbyvisiongame:['Spiel','mdi:dolby'], dolbyvisionfilmmaker:['Filmmaker','mdi:dolby'],
            dolbyvisioniqfilmmaker:['IQ Filmmaker','mdi:dolby']};
                    const s = id => (states[id] && !['unknown','unavailable'].includes(states[id].state)) ? states[id].state : null;
                    const hdr = s('sensor.xgimi_h20_hdr_format'), src = s('sensor.xgimi_h20_eingangsquelle'), m = s('select.xgimi_h20_bildmodus'), a = s('sensor.xgimi_h20_aktive_app');
                    const out = [];
                    if (hdr) out.push('<span class="badge' + (hdr === 'SDR' ? ' quiet' : '') + '">' + hdr + '</span>');
                    const line = [];
                    if (m) line.push('Bildmodus ' + (M[m] ? M[m][0] : m));
                    if (src && src !== a) line.push(src);
                    if (line.length) out.push('<span class="sub">' + line.join(' · ') + '</span>');
                    return out.join('');
                  ]]]
      styles:
        grid:
        - grid-template-areas: '"art eyebrow" "art title" "art meta"'
        - grid-template-columns: auto 1fr
        - grid-template-rows: auto auto auto
        - column-gap: 18px
        - align-items: center
        card:
        - padding: 20px
        - border-radius: 28px
        - font-family: '''SF Pro'', -apple-system, BlinkMacSystemFont, ''Helvetica Neue'', sans-serif'
        - border: 0.5px solid rgba(255,255,255,.28)
        - box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 8px 24px rgba(0,0,0,.25)
        custom_fields:
          art:
          - width: 88px
          - height: 88px
          - border-radius: 20px
          - display: flex
          - align-items: center
          - justify-content: center
          - background: '[[[ return [''on'',''screensaver''].includes(states[''sensor.xgimi_h20_betriebszustand''].state) ? ''linear-gradient(145deg,#5e5ce6 0%,#0a84ff 55%,#64d2ff 100%)'' : ''linear-gradient(145deg,#48484a,#2c2c2e)''; ]]]'
          - box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 10px 24px rgba(0,0,0,.35)
          - color: white
          - --mdc-icon-size: 44px
          eyebrow:
          - justify-self: start
          - font-size: 13px
          - font-weight: '600'
          - letter-spacing: .2px
          - color: var(--secondary-text-color)
          title:
          - justify-self: start
          - text-align: left
          - font-size: 28px
          - font-weight: '700'
          - letter-spacing: -.4px
          - line-height: '1.15'
          - color: var(--primary-text-color)
          - white-space: normal
          meta:
          - justify-self: start
          - display: flex
          - flex-wrap: wrap
          - align-items: center
          - gap: 8px
          - margin-top: 4px
      extra_styles: "\n      .badge { font-size: 11px; font-weight: 700; letter-spacing: .3px; padding: 3px 8px; border-radius: 6px;\n               color: #000; background: rgba(255,255,255,.92); }\n      .badge.quiet { color: var(--primary-text-color); background: transparent; border: 1px solid rgba(255,255,255,.5); }\n      .sub { font-size: 14px; color: var(--secondary-text-color); }\n    "
      grid_options:
        columns: full
